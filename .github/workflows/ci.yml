name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: "Run on self-hosted runner (label clerksuite-ci). Use for local Actions validation / larger Ollama models."
        type: boolean
        default: false
      ollama_model:
        description: "Ollama model (1.5b for ubuntu-latest; 3b/7b ok on self-hosted)"
        type: string
        default: "qwen2.5-coder:1.5b"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION: "Wiley.Apartments.slnx"
  OLLAMA_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.ollama_model || 'qwen2.5-coder:1.5b' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build + Unit + Integration
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_self_hosted) && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache NuGet HTTP
        uses: actions/cache@v4
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-http-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror

      - name: Unit tests
        id: unit
        run: |
          dotnet test tests/Wiley.Apartments.Tests/Wiley.Apartments.Tests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory TestResults \
            --verbosity normal

      - name: Integration tests
        id: integration
        run: |
          dotnet test tests/Wiley.Apartments.IntegrationTests/Wiley.Apartments.IntegrationTests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory TestResults \
            --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            TestResults/**
          retention-days: 5
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. E2E (Playwright) – isolated so unit/integration stay fast
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_self_hosted) && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    needs: build-and-test
    if: success()
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.playwright-browsers
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ms1.51.0-chromium
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install PowerShell
        uses: PSModule/install-powershell@v1
        with:
          Version: latest

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.SOLUTION }}
          dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          pwsh tests/Wiley.Apartments.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Browsers restored from cache; still need OS libs on fresh ubuntu-latest VMs
          pwsh tests/Wiley.Apartments.E2ETests/bin/Release/net9.0/playwright.ps1 install-deps chromium || true

      - name: Run E2E tests
        id: e2e
        run: |
          dotnet test tests/Wiley.Apartments.E2ETests/Wiley.Apartments.E2ETests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults \
            --verbosity normal

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            TestResults/**
            **/playwright-report/**
            **/test-results/**
            **/screenshots/**
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Ollama CI Findings Review Agent
  # ---------------------------------------------------------------------------
  ollama-ci-review:
    name: Ollama CI Review Agent
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.use_self_hosted) && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    needs: [build-and-test, e2e]
    if: always()
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
        continue-on-error: true

      - name: Collect CI summary
        id: summary
        run: |
          mkdir -p review-context
          {
            echo "## CI Run Context"
            echo "- Repo: ${{ github.repository }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- SHA: ${{ github.sha }}"
            echo "- Event: ${{ github.event_name }}"
            echo "- Runner: ${{ runner.name }} (${{ runner.os }})"
            echo "- Build & Test conclusion: ${{ needs.build-and-test.result }}"
            echo "- E2E conclusion: ${{ needs.e2e.result }}"
            echo "- Ollama model: ${{ env.OLLAMA_MODEL }}"
            echo ""
            echo "### Project constraints (must respect)"
            echo "- Blazor Interactive Server + Syncfusion Blazor ONLY (no MudBlazor/Radzen/plain HTML grids)"
            echo "- Spec Kit feature 001-wiley-apartment-v1; Phase 0 complete, Phase 1 (Units) next"
            echo "- SQLite default; NAS docs at /volume1/apartments/docs"
            echo "- AuditLog required; no role differentiation in v1"
            echo "- Secrets never in source (Keychain / user-secrets / env only)"
            echo ""
            echo "### Test result files present:"
            find ci-artifacts -type f \( -name "*.trx" -o -name "*.log" -o -name "*.txt" \) 2>/dev/null | head -40 || true
          } > review-context/ci-summary.md

          {
            echo "### Failure / warning excerpts (truncated)"
            grep -r -i -E "(error|fail|exception|assert|timeout|not found)" ci-artifacts --include="*.trx" --include="*.log" --include="*.txt" 2>/dev/null | head -80 || echo "(no obvious failure text found)"
          } >> review-context/ci-summary.md

          cat review-context/ci-summary.md

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Install Ollama
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version

      - name: Start Ollama server
        run: |
          # Prefer existing local daemon on self-hosted; otherwise start one.
          if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
            echo "Ollama already running"
            exit 0
          fi
          ollama serve &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed to start"
          exit 1

      - name: Pull model
        run: |
          echo "Ensuring model ${{ env.OLLAMA_MODEL }} is available..."
          ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Run Ollama CI Findings Review
        id: review
        env:
          MODEL: ${{ env.OLLAMA_MODEL }}
        run: |
          set -euo pipefail

          SYSTEM_PROMPT=$(cat <<'EOF'
          You are an expert .NET / Blazor / Spec-Kit CI review agent for the WileyApartments / ClerkSuite project.
          Be honest, accurate, and direct. Do not sugar-coat. Do not invent problems that are not supported by the CI data.
          Prefer concrete, prioritized actions a developer can take in the next 1–2 hours.

          Output strictly in this Markdown structure:

          ## Verdict
          One short paragraph: overall health of this CI run.

          ## Critical / Blocking
          Numbered list of real failures that must be fixed before merge. Include file/test name when visible. If none, write "None".

          ## High-priority improvements
          Concrete improvements that would make the suite more reliable or the code safer (missing asserts, flaky patterns, Syncfusion compliance risk, missing audit coverage, secret handling, etc.).

          ## Medium / Nice-to-have
          Optional clean-ups, better logging, test coverage gaps that are not currently failing.

          ## Recommended next actions (ordered)
          1. ...
          2. ...
          3. ...

          Rules:
          - Respect the Syncfusion-only UI mandate and Spec Kit Phase 0 → Phase 1 focus.
          - Never recommend adding non-Syncfusion UI libraries.
          - Never recommend committing license keys or secrets.
          - If the only issues are environmental (Playwright browser, timeout), say so clearly.
          - Keep the whole response under ~600 words.
          EOF
          )

          USER_CONTENT=$(cat review-context/ci-summary.md)

          RESPONSE=$(curl -s http://127.0.0.1:11434/api/generate \
            -d "$(jq -n \
              --arg model "$MODEL" \
              --arg system "$SYSTEM_PROMPT" \
              --arg prompt "$USER_CONTENT" \
              '{
                model: $model,
                system: $system,
                prompt: $prompt,
                stream: false,
                options: { temperature: 0.15, num_predict: 1200 }
              }')" | jq -r '.response // empty')

          if [ -z "$RESPONSE" ]; then
            RESPONSE="$(printf '%s\n' '## Verdict' 'Ollama returned an empty response. Check model availability and runner resources.')"
          fi

          echo "$RESPONSE" > review-context/ollama-review.md
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "### Ollama CI Findings Review"
            echo ""
            echo "$RESPONSE"
            echo ""
            echo "---"
            echo "*Generated by Ollama (\`${MODEL}\`) on the CI findings. Treat as advisory.*"
          } > review-context/pr-comment.md

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-ci-review
          path: review-context/
          retention-days: 14

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-context/pr-comment.md', 'utf8');
            const truncated = body.length > 65000
              ? body.substring(0, 65000) + '\n\n…(truncated)'
              : body;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: truncated
            });
