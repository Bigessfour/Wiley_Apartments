name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # No workflow_dispatch inputs (CKV_GHA_7). Self-hosted / model via repo vars:
  #   CI_USE_SELF_HOSTED=true  → runners labeled self-hosted,linux,clerksuite-ci
  #   OLLAMA_MODEL             → e.g. qwen2.5-coder:3b (default 1.5b)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  SOLUTION: Wiley.Apartments.slnx
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5-coder:1.5b' }}

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build + Unit + Integration
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.CI_USE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache NuGet HTTP
        uses: actions/cache@v4
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-http-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror

      - name: Unit tests
        id: unit
        run: |
          dotnet test tests/Wiley.Apartments.Tests/Wiley.Apartments.Tests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory TestResults \
            --verbosity normal

      - name: Integration tests
        id: integration
        run: |
          dotnet test tests/Wiley.Apartments.IntegrationTests/Wiley.Apartments.IntegrationTests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory TestResults \
            --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            TestResults/**
          retention-days: 5
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. E2E (Playwright) – isolated so unit/integration stay fast
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.CI_USE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    needs: build-and-test
    if: success()
    timeout-minutes: 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.playwright-browsers
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ms1.51.0-chromium
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install PowerShell
        uses: PSModule/install-powershell@v1
        with:
          Version: latest

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.SOLUTION }}
          dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          pwsh tests/Wiley.Apartments.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Browsers restored from cache; still need OS libs on fresh ubuntu-latest VMs
          pwsh tests/Wiley.Apartments.E2ETests/bin/Release/net9.0/playwright.ps1 install-deps chromium || true

      - name: Run E2E tests
        id: e2e
        run: |
          dotnet test tests/Wiley.Apartments.E2ETests/Wiley.Apartments.E2ETests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults \
            --verbosity normal

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            TestResults/**
            **/playwright-report/**
            **/test-results/**
            **/screenshots/**
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Ollama CI Findings Review Agent
  # ---------------------------------------------------------------------------
  ollama-ci-review:
    name: Ollama CI Review Agent
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.CI_USE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    needs: [build-and-test, e2e]
    if: always()
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
        continue-on-error: true

      - name: Collect CI summary
        id: summary
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          python3 scripts/ci-collect-ollama-summary.py review-context
          echo "REVIEW_MODE=$(tr -d '\n' < review-context/review-mode.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Ollama models
        id: ollama-cache
        if: steps.summary.outputs.REVIEW_MODE != 'GREEN_RUN'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Install Ollama
        if: steps.summary.outputs.REVIEW_MODE != 'GREEN_RUN'
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version

      - name: Start Ollama server
        if: steps.summary.outputs.REVIEW_MODE != 'GREEN_RUN'
        run: |
          if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
            echo "Ollama already running"
            exit 0
          fi
          ollama serve &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed to start"
          exit 1

      - name: Pull model
        if: steps.summary.outputs.REVIEW_MODE != 'GREEN_RUN'
        run: |
          echo "Ensuring model ${{ env.OLLAMA_MODEL }} is available..."
          ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Run Ollama CI Findings Review
        id: review
        env:
          MODEL: ${{ env.OLLAMA_MODEL }}
          REVIEW_MODE: ${{ steps.summary.outputs.REVIEW_MODE }}
        run: |
          set -euo pipefail

          USER_CONTENT=$(cat review-context/ci-summary.md)

          if [ "${REVIEW_MODE}" = "GREEN_RUN" ]; then
            # Deterministic summary — no model call (avoids template echo + saves ~10m on ubuntu-latest).
            PASS_LINE=$(grep -E '^\- `.*\.trx`' review-context/ci-summary.md | tr '\n' '; ' | sed 's/; $//')
            RESPONSE=$(printf '%s\n' \
              '## Verdict' \
              "CI is green (${PASS_LINE:-TRX counters in artifact})." \
              '' \
              '## Critical / Blocking' \
              'None' \
              '' \
              '## Actionable findings' \
              'None — no failing tests or job failures in the evidence.' \
              '' \
              '## Next' \
              'No CI follow-up required. Continue Spec Kit Phase 2 (tenants / occupancy) when product work resumes.')
          else
            SYSTEM_PROMPT=$(cat <<'EOF'
          You review CI failures for WileyApartments / ClerkSuite (.NET 9 Blazor Interactive Server + Syncfusion only).
          Be blunt and evidence-only. Every finding must quote a failed test name, error message, or job conclusion from the input.

          Output ONLY these four sections (no rules appendix, no preamble):

          ## Verdict
          One short paragraph: what failed and how bad it is for merge.

          ## Critical / Blocking
          Numbered list. Each item: test/job name + one-line cause + one concrete fix. If none, write "None".

          ## Actionable findings
          Numbered list of evidence-backed next fixes only (file/test names when present). Max 5.
          If environmental (Playwright, OOM, timeout), say so and give the exact retry/setup step.

          ## Next
          Ordered 1–3 commands or edits for the next hour.

          Constraints (follow silently — do not print them):
          - Use ONLY the provided CI evidence.
          - Never invent coverage/refactor/audit/secrets work.
          - Never recommend MudBlazor/Radzen or committing secrets.
          - Ignore Fluent Assertions / Xceed license text.
          - Respect NAS fence (2 clerks, ≤~1.5GiB, SQLite).
          - Keep under 350 words.
          EOF
          )

            RESPONSE=$(curl -s http://127.0.0.1:11434/api/generate \
              -d "$(jq -n \
                --arg model "$MODEL" \
                --arg system "$SYSTEM_PROMPT" \
                --arg prompt "$USER_CONTENT" \
                '{
                  model: $model,
                  system: $system,
                  prompt: $prompt,
                  stream: false,
                  options: { temperature: 0.1, num_predict: 700 }
                }')" | jq -r '.response // empty')

            if [ -z "$RESPONSE" ]; then
              RESPONSE="$(printf '%s\n' '## Verdict' 'Ollama returned an empty response. Check model availability and runner resources.' '## Critical / Blocking' 'None' '## Actionable findings' 'None' '## Next' 'Re-run the Ollama CI Review job.')"
            fi
          fi

          echo "$RESPONSE" > review-context/ollama-review.md
          {
            echo "### Ollama CI Findings Review (\`${REVIEW_MODE}\`)"
            echo ""
            echo "$RESPONSE"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "### Ollama CI Findings Review"
            echo ""
            echo "$RESPONSE"
            echo ""
            echo "---"
            echo "*Evidence-only review by Ollama (\`${MODEL}\`, mode \`${REVIEW_MODE}\`). Ignore if it invents work not backed by TRX/job evidence.*"
          } > review-context/pr-comment.md

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-ci-review
          path: review-context/
          retention-days: 14

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-context/pr-comment.md', 'utf8');
            const truncated = body.length > 65000
              ? body.substring(0, 65000) + '\n\n…(truncated)'
              : body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const marker = '### Ollama CI Findings Review';
            const prior = comments.filter(c =>
              c.user?.type === 'Bot' && c.body?.includes(marker));
            for (const c of prior) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: truncated
            });
