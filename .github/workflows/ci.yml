name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
      - "LICENSE"
      - ".gitignore"
  # No workflow_dispatch inputs (CKV_GHA_7). Self-hosted / model via repo vars:
  #   CI_USE_SELF_HOSTED=true  → runners labeled self-hosted,linux,clerksuite-ci
  #   OLLAMA_MODEL             → e.g. qwen2.5-coder:3b (default 1.5b)
  #   CI_FORCE_OLLAMA=true     → run Ollama review even when tests are green (dispatch only)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  SOLUTION: Wiley.Apartments.slnx
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5-coder:1.5b' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build + Unit + Integration
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.CI_USE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} --verbosity minimal

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore -warnaserror --verbosity minimal

      - name: Unit tests
        id: unit
        run: |
          dotnet test tests/Wiley.Apartments.Tests/Wiley.Apartments.Tests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory TestResults \
            --verbosity minimal

      - name: Integration tests
        id: integration
        run: |
          dotnet test tests/Wiley.Apartments.IntegrationTests/Wiley.Apartments.IntegrationTests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory TestResults \
            --verbosity minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            TestResults/**
          retention-days: 5
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. E2E (Playwright) – only after unit/integration pass
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.CI_USE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    needs: build-and-test
    if: success()
    timeout-minutes: 25
    env:
      ASPNETCORE_ENVIRONMENT: Development
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.playwright-browsers
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ms1.51.0-chromium
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install PowerShell
        uses: PSModule/install-powershell@v1
        with:
          Version: latest

      # Build only the E2E project graph (not the full solution a second time).
      - name: Restore & build E2E project
        run: |
          dotnet restore tests/Wiley.Apartments.E2ETests/Wiley.Apartments.E2ETests.csproj --verbosity minimal
          dotnet build tests/Wiley.Apartments.E2ETests/Wiley.Apartments.E2ETests.csproj \
            -c Release --no-restore --verbosity minimal

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          pwsh tests/Wiley.Apartments.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          # Browsers restored from cache; still need OS libs on fresh ubuntu-latest VMs
          pwsh tests/Wiley.Apartments.E2ETests/bin/Release/net9.0/playwright.ps1 install-deps chromium || true

      - name: Run E2E tests
        id: e2e
        run: |
          dotnet test tests/Wiley.Apartments.E2ETests/Wiley.Apartments.E2ETests.csproj \
            -c Release --no-build \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory TestResults \
            --verbosity minimal

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            TestResults/**
            **/playwright-report/**
            **/test-results/**
            **/screenshots/**
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

  # ---------------------------------------------------------------------------
  # 3. Ollama CI Findings Review — failures (or forced dispatch) only
  # ---------------------------------------------------------------------------
  # Skipped on green PRs/pushes (~1.5–2 min saved). Still runs when Build & Test
  # or E2E fails, or on workflow_dispatch when vars.CI_FORCE_OLLAMA == 'true'.
  ollama-ci-review:
    name: Ollama CI Review Agent
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.CI_USE_SELF_HOSTED == 'true') && fromJSON('["self-hosted","linux","clerksuite-ci"]') || 'ubuntu-latest' }}
    needs: [build-and-test, e2e]
    if: |
      always() && (
        needs.build-and-test.result == 'failure' ||
        needs.e2e.result == 'failure' ||
        (github.event_name == 'workflow_dispatch' && vars.CI_FORCE_OLLAMA == 'true')
      )
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
        continue-on-error: true

      - name: Collect CI summary
        id: summary
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          python3 scripts/ci-collect-ollama-summary.py review-context
          echo "REVIEW_MODE=$(tr -d '\n' < review-context/review-mode.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Install Ollama
        run: |
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version

      - name: Start Ollama server
        run: |
          if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
            echo "Ollama already running"
            exit 0
          fi
          ollama serve &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed to start"
          exit 1

      - name: Pull model
        run: |
          echo "Ensuring model ${{ env.OLLAMA_MODEL }} is available..."
          ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Run Ollama CI Findings Review
        id: review
        env:
          MODEL: ${{ env.OLLAMA_MODEL }}
          REVIEW_MODE: ${{ steps.summary.outputs.REVIEW_MODE }}
        run: |
          set -euo pipefail

          if [ "${REVIEW_MODE}" = "GREEN_RUN" ]; then
            SYSTEM_PROMPT=$(cat <<'EOF'
          You review CI results for WileyApartments / ClerkSuite (.NET 9 Blazor + Syncfusion).
          This is a GREEN_RUN: jobs succeeded and no failed tests were parsed.

          Output EXACTLY this Markdown (nothing else):

          ## Verdict
          One sentence: CI is green; cite TRX pass counts if present.

          ## Critical / Blocking
          None

          ## Actionable findings
          None — no failing tests or job failures in the evidence.

          ## Next
          No CI follow-up required.

          Hard rules:
          - Do NOT invent coverage gaps, refactors, audit logging, or secret-handling tasks.
          - Do NOT mention Fluent Assertions / Xceed license banners.
          - Do NOT recommend non-Syncfusion UI libraries or committing secrets.
          - Keep under 120 words.
          EOF
          )
            NUM_PREDICT=220
          else
            SYSTEM_PROMPT=$(cat <<'EOF'
          You review CI failures for WileyApartments / ClerkSuite (.NET 9 Blazor Interactive Server + Syncfusion only).
          Be blunt and evidence-only. Every finding must quote a failed test name, error message, or job conclusion from the input.

          Output EXACTLY this Markdown:

          ## Verdict
          One short paragraph: what failed and how bad it is for merge.

          ## Critical / Blocking
          Numbered list. Each item: test/job name + one-line cause + one concrete fix. If none, write "None".

          ## Actionable findings
          Numbered list of evidence-backed next fixes only (file/test names when present). Max 5.
          If the failure looks environmental (Playwright browsers, OOM, timeout, missing artifact), say so and give the exact retry/setup step.

          ## Next
          Ordered 1–3 commands or edits a developer should do in the next hour.

          Hard rules:
          - Use ONLY the provided CI evidence. No repo archaeology. No generic advice.
          - Never recommend: adding MudBlazor/Radzen, inventing audit/secrets systems, "improve coverage", "refactor for readability", or committing secrets.
          - Fluent Assertions / Xceed license text is NOT a failure — ignore it.
          - Respect NAS fence (2 clerks, ≤~1.5GiB, SQLite, rare NAS deploys) — do not suggest heavy infra.
          - Keep under 350 words.
          EOF
          )
            NUM_PREDICT=700
          fi

          USER_CONTENT=$(cat review-context/ci-summary.md)

          RESPONSE=$(curl -s http://127.0.0.1:11434/api/generate \
            -d "$(jq -n \
              --arg model "$MODEL" \
              --arg system "$SYSTEM_PROMPT" \
              --arg prompt "$USER_CONTENT" \
              --argjson num "$NUM_PREDICT" \
              '{
                model: $model,
                system: $system,
                prompt: $prompt,
                stream: false,
                options: { temperature: 0.1, num_predict: $num }
              }')" | jq -r '.response // empty')

          if [ -z "$RESPONSE" ]; then
            RESPONSE="$(printf '%s\n' '## Verdict' 'Ollama returned an empty response. Check model availability and runner resources.' '## Critical / Blocking' 'None' '## Actionable findings' 'None' '## Next' 'Re-run the Ollama CI Review job.')"
          fi

          echo "$RESPONSE" > review-context/ollama-review.md
          {
            echo "### Ollama CI Findings Review (\`${REVIEW_MODE}\`)"
            echo ""
            echo "$RESPONSE"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "### Ollama CI Findings Review"
            echo ""
            echo "$RESPONSE"
            echo ""
            echo "---"
            echo "*Evidence-only review by Ollama (\`${MODEL}\`, mode \`${REVIEW_MODE}\`). Ignore if it invents work not backed by TRX/job evidence.*"
          } > review-context/pr-comment.md

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-ci-review
          path: review-context/
          retention-days: 14

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-context/pr-comment.md', 'utf8');
            const truncated = body.length > 65000
              ? body.substring(0, 65000) + '\n\n…(truncated)'
              : body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const marker = '### Ollama CI Findings Review';
            const prior = comments.filter(c =>
              c.user?.type === 'Bot' && c.body?.includes(marker));
            for (const c of prior) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: c.id
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: truncated
            });
