services:
  clerksuite:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: clerksuite
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: America/Denver
      ConnectionStrings__DefaultConnection: Data Source=/data/clerksuite.db
      ClerkSuite__DatabaseProvider: Sqlite
      ClerkSuite__DocumentRoot: /docs
      ClerkSuite__LateFeesEnabled: "false"
      ClerkSuite__PaymentPortalUrl: ${PaymentPortalUrl:-https://www.townofwiley.gov/government/departments/finance/utility-billing}
      SYNCFUSION_LICENSE_KEY: ${SYNCFUSION_LICENSE_KEY}
    volumes:
      - clerksuite-data:/data
      - ${DOCUMENTS_HOST_PATH:-./local-docs}:/docs
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

volumes:
  clerksuite-data:
