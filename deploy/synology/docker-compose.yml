# ClerkSuite on Synology DS225+ — Option B (image built on Mac, loaded on NAS).
# Project dir on NAS: /volume1/docker/clerksuite
# Secrets: .env next to this file (chmod 600). Never commit .env.
services:
  clerksuite:
    image: clerksuite:latest
    container_name: clerksuite
    restart: unless-stopped
    # Host 8082 — NAS :8080 is already used by tikr-web
    ports:
      - 8082:8080
    # Compose v2 keys — Synology/non-Swarm often ignores deploy.resources.
    mem_limit: 1536m
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: America/Denver
      ConnectionStrings__DefaultConnection: Data Source=/data/clerksuite.db
      ClerkSuite__DatabaseProvider: Sqlite
      ClerkSuite__DocumentRoot: /docs
      ClerkSuite__LateFeesEnabled: "false"
      ClerkSuite__PaymentPortalUrl: ${PaymentPortalUrl:-https://www.townofwiley.gov/government/departments/finance/utility-billing}
      SYNCFUSION_LICENSE_KEY: ${SYNCFUSION_LICENSE_KEY}
      # Seeded on first boot only (skips if email already exists). Do not put real passwords in git.
      SeedUsers__Users__0__Email: ${SeedUsers__Users__0__Email:-}
      SeedUsers__Users__0__Password: ${SeedUsers__Users__0__Password:-}
      SeedUsers__Users__0__DisplayName: ${SeedUsers__Users__0__DisplayName:-Town Clerk}
    volumes:
      - clerksuite-data:/data
      - ${DOCUMENTS_HOST_PATH}:/docs
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

volumes:
  clerksuite-data:
