# Optional override — Postgres companion (NOT production default; G4)
services:
  clerksuite-db:
    image: postgres:16-alpine
    container_name: clerksuite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clerksuite
      POSTGRES_USER: clerksuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - clerksuite-pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  clerksuite:
    depends_on:
      - clerksuite-db
    environment:
      ConnectionStrings__DefaultConnection: Host=clerksuite-db;Database=clerksuite;Username=clerksuite;Password=${POSTGRES_PASSWORD:-change-me}
      ClerkSuite__DatabaseProvider: Postgres

volumes:
  clerksuite-pgdata:
